<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Tiles - Custom Song</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            background: #eee;
            display: block;
        }
        #fileInput {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            padding: 8px;
            background: white;
            color: black;
        }
        #loadingText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #3278f0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <input type="file" id="fileInput" accept="audio/*" />
        <div id="loadingText">Analyzing your song...</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fileInput = document.getElementById("fileInput");
        const loadingText = document.getElementById("loadingText");

        // ======================
        // 游戏核心设置
        // ======================
        const TRACK_KEYS = ['d', 'f', 'j', 'k'];
        const COLUMN_WIDTH = 400 / 4;
        const TILE_HEIGHT = 130;
        const HIT_LINE_Y = 600 - 120;

        let currentState = "MENU";
        let activeTiles = [];
        let noteTimes = [];
        let tileSpeed = 7;
        let score = 0;
        let hp = 100;
        let feedbackText = "";
        let feedbackColor = "";
        let feedbackTimer = 0;
        let gameStartTicks = 0;
        let userAudio = null;

        // 音频上下文（用于分析歌曲）
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // ======================
        // 1. 用户上传歌曲 → 自动分析节奏生成音符
        // ======================
        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loadingText.style.display = "block";
            currentState = "BUFFER";

            // 读取音频文件
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            // 分析节奏 → 生成 noteTimes（游戏下落时间点）
            noteTimes = detectOnsets(audioBuffer);

            // 创建玩家的歌曲
            userAudio = new Audio(URL.createObjectURL(file));

            loadingText.style.display = "none";
            startGame();
        });

        // 音频节奏检测算法（浏览器端自动找鼓点/旋律）
        function detectOnsets(audioBuffer) {
            const channelData = audioBuffer.getChannelData(0);
            const blockSize = 1024;
            const times = [];
            let lastPeak = 0;

            for (let i = 0; i < channelData.length; i += blockSize) {
                const block = channelData.slice(i, i + blockSize);
                let sum = 0;
                for (let s of block) sum += s * s;
                const rms = Math.sqrt(sum / block.length);

                if (rms > 0.015 && (i / audioBuffer.sampleRate) - lastPeak > 0.3) {
                    times.push(i / audioBuffer.sampleRate);
                    lastPeak = i / audioBuffer.sampleRate;
                }
            }
            return times;
        }

        // ======================
        // 2. 游戏逻辑
        // ======================
        function startGame() {
            activeTiles = [];
            score = 0;
            hp = 100;
            feedbackTimer = 0;
            currentState = "PLAYING";
            gameStartTicks = Date.now();
            userAudio.play();
        }

        // 点击音效
        function playHitSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = 587;
            gain.gain.value = 0.2;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 键盘敲击
        window.addEventListener("keydown", (e) => {
            if (currentState !== "PLAYING") return;
            const idx = TRACK_KEYS.indexOf(e.key.toLowerCase());
            if (idx === -1) return;

            let hit = false;
            for (let t of activeTiles) {
                if (t.col === idx && !t.hit) {
                    const dist = Math.abs((t.y + TILE_HEIGHT) - HIT_LINE_Y);
                    if (dist < 80) {
                        t.hit = true;
                        score++;
                        feedbackText = dist < 40 ? "PERFECT!" : "GOOD";
                        feedbackColor = dist < 40 ? "#28a745" : "#e68c0a";
                        feedbackTimer = 20;
                        playHitSound();
                        hit = true;
                        break;
                    }
                }
            }
            if (!hit) {
                hp -= 10;
                feedbackText = "MISS";
                feedbackColor = "#dc3545";
                feedbackTimer = 20;
            }
        });

        // ======================
        // 3. 主渲染循环
        // ======================
        function update() {
            ctx.fillStyle = "#f5f5f5";
            ctx.fillRect(0, 0, 400, 600);

            // 引导线
            ctx.strokeStyle = "#999";
            ctx.lineWidth = 2;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(i * COLUMN_WIDTH, 0);
                ctx.lineTo(i * COLUMN_WIDTH, 600);
                ctx.stroke();
            }
            ctx.strokeStyle = "#3296f0";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, HIT_LINE_Y);
            ctx.lineTo(400, HIT_LINE_Y);
            ctx.stroke();

            if (currentState === "MENU") {
                ctx.fillStyle = "#222";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Upload a song to play!", 200, 250);
            }

            if (currentState === "PLAYING") {
                const elapsed = (Date.now() - gameStartTicks) / 1000;

                // 自动生成方块
                if (noteTimes.length && elapsed >= noteTimes[0]) {
                    noteTimes.shift();
                    const col = Math.floor(Math.random() * 4);
                    activeTiles.push({ x: col * COLUMN_WIDTH, y: -TILE_HEIGHT, col, hit: false });
                }

                // 方块下落
                for (let i = activeTiles.length - 1; i >= 0; i--) {
                    const t = activeTiles[i];
                    t.y += tileSpeed;
                    if (!t.hit) {
                        ctx.fillStyle = "#222";
                        ctx.fillRect(t.x, t.y, COLUMN_WIDTH - 2, TILE_HEIGHT);
                    }
                    if (t.y > 600) {
                        if (!t.hit) hp -= 12;
                        activeTiles.splice(i, 1);
                    }
                }

                // 血量
                ctx.fillStyle = hp < 30 ? "#f03250" : "#28c764";
                ctx.fillRect(15, 15, hp * 1.5, 15);

                // 分数
                ctx.fillStyle = "#222";
                ctx.font = "16px Arial";
                ctx.fillText("Score: " + score, 15, 45);

                // 反馈
                if (feedbackTimer > 0) {
                    ctx.fillStyle = feedbackColor;
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, 200, 350);
                    feedbackTimer--;
                }

                // 游戏结束
                if (hp <= 0) {
                    currentState = "MENU";
                    userAudio.pause();
                    userAudio.currentTime = 0;
                }
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
