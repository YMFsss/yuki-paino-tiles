<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Tiles - Custom Song</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            background: #2d2d2d;
        }
        canvas {
            display: block;
            background: #1e1e1e;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .interactive {
            pointer-events: auto;
        }
        #fileInputLabel {
            padding: 12px 24px;
            background: #3278f0;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(50,120,240,0.4);
        }
        #fileInputLabel:hover {
            background: #2262d0;
        }
        #fileInput {
            display: none;
        }
        #loadingText {
            font-size: 20px;
            color: #3278f0;
            font-weight: bold;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="uiLayer">
            <label id="fileInputLabel" class="interactive">
                Choose an Audio File
                <input type="file" id="fileInput" accept="audio/*" />
            </label>
            <div id="loadingText">Analyzing audio frequencies...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fileInput = document.getElementById("fileInput");
        const fileInputLabel = document.getElementById("fileInputLabel");
        const loadingText = document.getElementById("loadingText");

        // ======================
        // Configuration
        // ======================
        const TRACK_KEYS = ['d', 'f', 'j', 'k'];
        const COLUMN_WIDTH = 400 / 4;
        const TILE_HEIGHT = 100;
        const HIT_LINE_Y = 600 - 120;
        
        // Time it takes for a tile to travel from y=0 to y=HIT_LINE_Y (in seconds)
        const SCROLL_DURATION = 1.2; 

        let currentState = "MENU";
        let activeTiles = [];
        let noteTimes = [];
        let score = 0;
        let hp = 100;
        
        let feedbackText = "";
        let feedbackColor = "";
        let feedbackTimer = 0;
        
        let userAudio = null;
        let audioCtx = null;
        let songStartTime = 0;

        // ======================
        // 1. Audio Processing
        // ======================
        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Initialize AudioContext on user gesture
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            fileInputLabel.style.display = "none";
            loadingText.style.display = "block";
            currentState = "BUFFER";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // Analyze beats and clean up layout variables
                noteTimes = detectOnsets(audioBuffer);

                if (userAudio) {
                    userAudio.pause();
                    userAudio.remove();
                }

                userAudio = new Audio(URL.createObjectURL(file));
                loadingText.style.display = "none";
                
                // Slight delay to allow browser thread to catch its breath
                setTimeout(startGame, 500);
            } catch (err) {
                alert("Error parsing audio file. Try an MP3 or WAV.");
                fileInputLabel.style.display = "block";
                loadingText.style.display = "none";
                currentState = "MENU";
            }
        });

        // Dynamic Peak Threshold Algorithm 
        function detectOnsets(audioBuffer) {
            const channelData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const blockSize = 2048; 
            const times = [];
            
            let lastPeakTime = 0;
            const minInterval = 0.28; // Prevents tiles from overlapping too densely

            for (let i = 0; i < channelData.length; i += blockSize) {
                const block = channelData.slice(i, i + blockSize);
                let sum = 0;
                for (let j = 0; j < block.length; j++) {
                    sum += block[j] * block[j];
                }
                const rms = Math.sqrt(sum / block.length);
                const currentTime = i / sampleRate;

                // Threshold filter for structural transients (beats/melodies)
                if (rms > 0.025 && (currentTime - lastPeakTime) > minInterval) {
                    times.push(currentTime);
                    lastPeakTime = currentTime;
                }
            }
            return times;
        }

        // ======================
        // 2. Gameplay Management
        // ======================
        function startGame() {
            score = 0;
            hp = 100;
            feedbackTimer = 0;
            
            // Map raw timestamps to concrete game Tile entities
            activeTiles = noteTimes.map(time => {
                const col = Math.floor(Math.random() * 4);
                return {
                    spawnTime: time - SCROLL_DURATION, // Spawn early so it hits the line perfectly on time
                    targetTime: time,
                    col: col,
                    hit: false,
                    missed: false
                };
            });

            currentState = "PLAYING";
            userAudio.play();
            songStartTime = audioCtx.currentTime;
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        window.addEventListener("keydown", (e) => {
            if (currentState !== "PLAYING") return;
            const idx = TRACK_KEYS.indexOf(e.key.toLowerCase());
            if (idx === -1) return;

            const currentAudioTime = audioCtx.currentTime - songStartTime;
            let handled = false;

            for (let t of activeTiles) {
                if (t.col === idx && !t.hit && !t.missed) {
                    const timeDiff = Math.abs(currentAudioTime - t.targetTime);
                    
                    // Hit detection window (in seconds)
                    if (timeDiff < 0.15) { 
                        t.hit = true;
                        handled = true;
                        playHitSound();

                        if (timeDiff < 0.06) {
                            score += 100;
                            feedbackText = "PERFECT!";
                            feedbackColor = "#28a745";
                        } else {
                            score += 50;
                            feedbackText = "GOOD";
                            feedbackColor = "#e68c0a";
                        }
                        feedbackTimer = 30;
                        break;
                    }
                }
            }

            if (!handled) {
                hp -= 5;
                feedbackText = "MISS";
                feedbackColor = "#dc3545";
                feedbackTimer = 30;
            }
        });

        // ======================
        // 3. Engine Loop
        // ======================
        function update() {
            // Draw background tracks
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, 400, 600);

            // Track Separators
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 2;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(i * COLUMN_WIDTH, 0);
                ctx.lineTo(i * COLUMN_WIDTH, 600);
                ctx.stroke();
            }

            // Hit Line
            ctx.strokeStyle = "rgba(50, 120, 240, 0.8)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, HIT_LINE_Y);
            ctx.lineTo(400, HIT_LINE_Y);
            ctx.stroke();

            if (currentState === "MENU") {
                ctx.fillStyle = "#aaaaaa";
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Controls: D  F  J  K", 200, 400);
            }

            if (currentState === "PLAYING") {
                const currentAudioTime = audioCtx.currentTime - songStartTime;

                // Process/Render Tiles
                for (let i = 0; i < activeTiles.length; i++) {
                    const t = activeTiles[i];
                    
                    // Only process tiles that should be visible on screen
                    if (currentAudioTime >= t.spawnTime) {
                        
                        // Calculate exact Y coordinate based on elapsed time ratio
                        const progress = (currentAudioTime - t.spawnTime) / SCROLL_DURATION;
                        const currentY = progress * HIT_LINE_Y - TILE_HEIGHT;

                        // Check for natural miss conditions
                        if (currentAudioTime > t.targetTime + 0.15 && !t.hit && !t.missed) {
                            t.missed = true;
                            hp -= 8;
                            feedbackText = "MISS";
                            feedbackColor = "#dc3545";
                            feedbackTimer = 30;
                        }

                        // Draw if not struck
                        if (!t.hit && currentY < 600) {
                            ctx.fillStyle = t.missed ? "#442222" : "#ffffff";
                            ctx.fillRect(t.col * COLUMN_WIDTH + 4, currentY, COLUMN_WIDTH - 8, TILE_HEIGHT);
                        }
                    }
                }

                // UI Status Display (HP Bar)
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, 400, 50);

                ctx.fillStyle = hp < 30 ? "#dc3545" : "#28a745";
                ctx.fillRect(20, 18, Math.max(0, hp) * 1.5, 14);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "left";
                ctx.fillText("SCORE: " + score, 200, 30);

                // Visual Judgement Feedback
                if (feedbackTimer > 0) {
                    ctx.fillStyle = feedbackColor;
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, 200, 300);
                    feedbackTimer--;
                }

                // Failure Check or Song Completion Check
                if (hp <= 0 || (userAudio && userAudio.ended)) {
                    currentState = "MENU";
                    userAudio.pause();
                    fileInputLabel.style.display = "block";
                    fileInput.value = ""; // Clear file choice
                }
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
