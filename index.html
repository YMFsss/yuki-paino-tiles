<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melody Tiles - Custom Song</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            /* Prevents accidental pull-to-refresh or native scrolling on mobile gestures */
            touch-action: none; 
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            background: #2d2d2d;
        }
        canvas {
            display: block;
            background: #1e1e1e;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .interactive {
            pointer-events: auto;
        }
        .btn {
            padding: 12px 30px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
            border: none;
            font-size: 16px;
        }
        #pcBtn {
            background: #3278f0;
            box-shadow: 0 4px 15px rgba(50,120,240,0.4);
        }
        #mobileBtn {
            background: #e68c0a;
            box-shadow: 0 4px 15px rgba(230,140,10,0.4);
        }
        #fileInputLabel {
            background: #28a745;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
            display: none;
        }
        .btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        #fileInput {
            display: none;
        }
        #loadingText {
            font-size: 20px;
            color: #3278f0;
            font-weight: bold;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="uiLayer">
            <button id="pcBtn" class="btn interactive">Play on PC (D F J K)</button>
            <button id="mobileBtn" class="btn interactive">Play on Mobile (Touch)</button>

            <label id="fileInputLabel" class="btn interactive">
                Choose an Audio File
                <input type="file" id="fileInput" accept="audio/*" />
            </label>
            <div id="loadingText">Analyzing audio frequencies...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fileInput = document.getElementById("fileInput");
        const fileInputLabel = document.getElementById("fileInputLabel");
        const pcBtn = document.getElementById("pcBtn");
        const mobileBtn = document.getElementById("mobileBtn");
        const loadingText = document.getElementById("loadingText");

        // ======================
        // Configuration
        // ======================
        const TRACK_KEYS = ['d', 'f', 'j', 'k'];
        const COLUMN_WIDTH = 400 / 4;
        const TILE_HEIGHT = 100;
        const HIT_LINE_Y = 600 - 120;
        const SCROLL_DURATION = 1.2; 

        let currentState = "MENU"; 
        let selectedDevice = null; // "PC" or "MOBILE"
        let activeTiles = [];
        let noteTimes = [];
        let score = 0;
        let hp = 100;
        
        let feedbackText = "";
        let feedbackColor = "";
        let feedbackTimer = 0;
        
        let userAudio = null;
        let audioCtx = null;
        let songStartTime = 0;

        // ======================
        // 1. Device Selection Setup
        // ======================
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        pcBtn.addEventListener("click", () => {
            initAudioContext();
            selectedDevice = "PC";
            showUploadOption();
        });

        mobileBtn.addEventListener("click", () => {
            initAudioContext();
            selectedDevice = "MOBILE";
            showUploadOption();
        });

        function showUploadOption() {
            pcBtn.style.display = "none";
            mobileBtn.style.display = "none";
            fileInputLabel.style.display = "block";
        }

        // ======================
        // 2. Audio Processing
        // ======================
        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileInputLabel.style.display = "none";
            loadingText.style.display = "block";
            currentState = "BUFFER";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                noteTimes = detectOnsets(audioBuffer);

                if (userAudio) {
                    userAudio.pause();
                    userAudio.remove();
                }

                userAudio = new Audio(URL.createObjectURL(file));
                loadingText.style.display = "none";
                
                setTimeout(startGame, 500);
            } catch (err) {
                alert("Error parsing audio file. Try an MP3 or WAV.");
                fileInputLabel.style.display = "block";
                loadingText.style.display = "none";
                currentState = "MENU";
            }
        });

        function detectOnsets(audioBuffer) {
            const channelData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const blockSize = 2048; 
            const times = [];
            
            let lastPeakTime = 0;
            const minInterval = 0.28; 

            for (let i = 0; i < channelData.length; i += blockSize) {
                const block = channelData.slice(i, i + blockSize);
                let sum = 0;
                for (let j = 0; j < block.length; j++) {
                    sum += block[j] * block[j];
                }
                const rms = Math.sqrt(sum / block.length);
                const currentTime = i / sampleRate;

                if (rms > 0.025 && (currentTime - lastPeakTime) > minInterval) {
                    times.push(currentTime);
                    lastPeakTime = currentTime;
                }
            }
            return times;
        }

        // ======================
        // 3. Gameplay Management
        // ======================
        function startGame() {
            score = 0;
            hp = 100;
            feedbackTimer = 0;
            
            activeTiles = noteTimes.map(time => {
                const col = Math.floor(Math.random() * 4);
                return {
                    spawnTime: time - SCROLL_DURATION, 
                    targetTime: time,
                    col: col,
                    hit: false,
                    missed: false
                };
            });

            currentState = "PLAYING";
            userAudio.play();
            songStartTime = audioCtx.currentTime;
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Common Core Hit Check Logic shared by Keydown and Touchstart
        function processHitRegister(trackIndex) {
            const currentAudioTime = audioCtx.currentTime - songStartTime;
            let handled = false;

            for (let t of activeTiles) {
                if (t.col === trackIndex && !t.hit && !t.missed) {
                    const timeDiff = Math.abs(currentAudioTime - t.targetTime);
                    
                    if (timeDiff < 0.15) { 
                        t.hit = true;
                        handled = true;
                        playHitSound();

                        if (timeDiff < 0.06) {
                            score += 100;
                            feedbackText = "PERFECT!";
                            feedbackColor = "#28a745";
                        } else {
                            score += 50;
                            feedbackText = "GOOD";
                            feedbackColor = "#e68c0a";
                        }
                        feedbackTimer = 30;
                        break;
                    }
                }
            }

            if (!handled) {
                hp -= 5;
                feedbackText = "MISS";
                feedbackColor = "#dc3545";
                feedbackTimer = 30;
            }
        }

        // PC Key Down Input
        window.addEventListener("keydown", (e) => {
            if (currentState !== "PLAYING" || selectedDevice !== "PC") return;
            const idx = TRACK_KEYS.indexOf(e.key.toLowerCase());
            if (idx !== -1) {
                processHitRegister(idx);
            }
        });

        // Mobile Touch Processing Screen Mapping
        canvas.addEventListener("touchstart", (e) => {
            if (currentState !== "PLAYING" || selectedDevice !== "MOBILE") return;
            
            // Prevent zooming/double-tap delays natively
            e.preventDefault(); 
            
            // Track dimensions bounding box relative to client view
            const rect = canvas.getBoundingClientRect();
            
            // Process all active continuous touch points (multi-touch support)
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                // Get tap location transformed into native canvas coordinates (0 to 400 px)
                const relativeX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
                
                // Determine target track column (0, 1, 2, or 3)
                const trackIdx = Math.floor(relativeX / COLUMN_WIDTH);
                
                if (trackIdx >= 0 && trackIdx < 4) {
                    processHitRegister(trackIdx);
                }
            }
        }, { passive: false });

        // ======================
        // 4. Engine Loop
        // ======================
        function update() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, 400, 600);

            // Track Separators
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 2;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(i * COLUMN_WIDTH, 0);
                ctx.lineTo(i * COLUMN_WIDTH, 600);
                ctx.stroke();
            }

            // Hit Line
            ctx.strokeStyle = "rgba(50, 120, 240, 0.8)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, HIT_LINE_Y);
            ctx.lineTo(400, HIT_LINE_Y);
            ctx.stroke();

            if (currentState === "MENU") {
                ctx.fillStyle = "#aaaaaa";
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                if (!selectedDevice) {
                    ctx.fillText("Select your platform to play", 200, 250);
                } else {
                    const controlHint = selectedDevice === "PC" ? "Controls: D  F  J  K" : "Controls: Tap Lanes Below Hit Line";
                    ctx.fillText(controlHint, 200, 400);
                }
            }

            if (currentState === "PLAYING") {
                const currentAudioTime = audioCtx.currentTime - songStartTime;

                for (let i = 0; i < activeTiles.length; i++) {
                    const t = activeTiles[i];
                    
                    if (currentAudioTime >= t.spawnTime) {
                        const progress = (currentAudioTime - t.spawnTime) / SCROLL_DURATION;
                        const currentY = progress * HIT_LINE_Y - TILE_HEIGHT;

                        if (currentAudioTime > t.targetTime + 0.15 && !t.hit && !t.missed) {
                            t.missed = true;
                            hp -= 8;
                            feedbackText = "MISS";
                            feedbackColor = "#dc3545";
                            feedbackTimer = 30;
                        }

                        if (!t.hit && currentY < 600) {
                            ctx.fillStyle = t.missed ? "#442222" : "#ffffff";
                            ctx.fillRect(t.col * COLUMN_WIDTH + 4, currentY, COLUMN_WIDTH - 8, TILE_HEIGHT);
                        }
                    }
                }

                // UI Display Panel
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, 400, 50);

                ctx.fillStyle = hp < 30 ? "#dc3545" : "#28a745";
                ctx.fillRect(20, 18, Math.max(0, hp) * 1.5, 14);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "left";
                ctx.fillText("SCORE: " + score, 200, 30);

                if (feedbackTimer > 0) {
                    ctx.fillStyle = feedbackColor;
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, 200, 300);
                    feedbackTimer--;
                }

                if (hp <= 0 || (userAudio && userAudio.ended)) {
                    currentState = "MENU";
                    userAudio.pause();
                    
                    // Show initial structural setup buttons for replay
                    pcBtn.style.display = "block";
                    mobileBtn.style.display = "block";
                    fileInputLabel.style.display = "none";
                    fileInput.value = ""; 
                    selectedDevice = null;
                }
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
